<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Космос: Кассиопея + фоновые звёзды + эклиптика</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000000; font-family: Arial, sans-serif; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 14px 24px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s;
    }
    button:hover { background-color: rgba(255, 255, 255, 0.5); }

    #status {
      position: absolute;
      bottom: 15px;
      left: 15px;
      color: #cccccc;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btn-left">← −1h</button>
    <button id="btn-right">+1h →</button>
  </div>
  <div id="status">Загрузка сцены...</div>

  <script async src="https://unpkg.com/es-module-shims@1.10.1/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 6.2);
    dirLight.position.set(20, 20, 20);
    scene.add(dirLight);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const tiltAngle = 23.44 * (Math.PI / 180);
    earthGroup.rotation.z = -tiltAngle;

    // Оси
    const axesHelper = new THREE.AxesHelper(3);
    axesHelper.position.set(0, 0, 0);
    scene.add(axesHelper);

    // Наклонная ось (серая линия)
    const poleLength = 5.0;
    const poleGeo = new THREE.CylinderGeometry(0.02, 0.02, poleLength, 16);
    const poleMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = poleLength / 2;
    earthGroup.add(pole);

    // Небесная сфера
    const sphereRadius = 4.0;
    const sphereGeo = new THREE.SphereGeometry(sphereRadius, 64, 64);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x222244,
      transparent: true,
      opacity: 0.85,
      roughness: 0.8,
      metalness: 0.95
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.set(0, 0, 0);
    scene.add(sphere);

    // --- РАСЧЁТ РАЗМЕРА ЗВЕЗДЫ ПО ЗВЁЗДНОЙ ВЕЛИЧИНЕ ---
    const sunRadius = 0.12;
    const baseStarRadius = sunRadius * 0.25; // m=0 → 1/4 радиуса Солнца

    function getStarSize(mag) {
      const factor = Math.pow(2.512, -mag);
      const size = baseStarRadius * factor;
      return Math.max(0.01, size);
    }

    // --- СОЗДАНИЕ ЗВЕЗДЫ ---
    function createStar(raHours, decDeg, mag, color) {
      const raRad = (raHours * 15) * (Math.PI / 180);
      const decRad = decDeg * (Math.PI / 180);

      const x = Math.cos(decRad) * Math.sin(raRad);
      const y = Math.sin(decRad);
      const z = Math.cos(decRad) * Math.cos(raRad);

      const size = getStarSize(mag);
      const geo = new THREE.SphereGeometry(size, 12, 12);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.set(x * sphereRadius, y * sphereRadius, z * sphereRadius);
      earthGroup.add(mesh);
      return mesh;
    }

    // --- КАССИОПЕЯ (α, β, δ, υ) ---
    const cassiopeiaStars = [
      { name: 'α (Шедар)', ra: 0.408, dec: 56.537, mag: 2.22, color: 0xffa500 },
      { name: 'β (Каф)',   ra: 0.139, dec: 59.150, mag: 2.28, color: 0xffd700 },
      { name: 'g (Каф)',   ra: 0.139, dec: 59.150, mag: 2.28, color: 0xffd700 },
      { name: 'δ (Рукбах)',ra: 1.317, dec: 60.175, mag: 2.68, color: 0xf0e68c },
      { name: 'υ (Ипсилон)',ra:3.383, dec: 48.783, mag: 4.80, color: 0xccccff }
    ];
    cassiopeiaStars.forEach(star => createStar(star.ra, star.dec, star.mag, star.color));

    // --- ПРЕЖНИЕ ФОНОВЫЕ ЗВЁЗДЫ (как было раньше) ---
    createStar(2.52, 89.26, 1.5, 0xffffff);       // яркая северная
    createStar(5.44, 28.60, 1.8, 0xffeb3b);       // жёлто-оранжевая
    createStar(18.36, -28.75, 1.9, 0xf44336);     // красноватая


    // Звёзды Тельца: α, β, γ, δ, ζ
const taurusStars = [
  { name: 'α (Альдебаран)', ra: 4.598,  dec: 16.509, mag: 0.85, color: 0xff8c00 }, // оранжево‑красный
  { name: 'β (Эль-Нат)',    ra: 5.278,  dec: 28.600, mag: 1.65, color: 0x7bcfe0 }, // голубоватый
  { name: 'γ (Морда)',      ra: 4.675,  dec: 22.600, mag: 3.65, color: 0xffd700 }, // жёлтый
  { name: 'δ₁ (Ноздря)',    ra: 4.950,  dec: 22.000, mag: 3.77, color: 0xffd700 }, // жёлтый
  { name: 'ζ (Аль-Хекка)',  ra: 5.6545,  dec: 21.900, mag: 3.00, color: 0x7bcfe0 }  // голубоватый
];
 taurusStars.forEach(star => createStar(star.ra, star.dec, star.mag, star.color));

    const extraStars = [
      { ra: 0.91, dec: 56.7,  mag: 2.1, color: 0xddddff },
      { ra: 5.26, dec: 45.9,  mag: 2.3, color: 0xffccaa },
      { ra: 10.17, dec: 11.9, mag: 2.5, color: 0xffd700 },
      { ra: 14.96, dec: -16.5,mag: 2.7, color: 0xffb6c1 },
      { ra: 20.71, dec: -16.1,mag: 2.8, color: 0x90ee90 },
      { ra: 22.29, dec: -0.8, mag: 3.0, color: 0xadd8e6 }
    ];
    extraStars.forEach(star => createStar(star.ra, star.dec, star.mag, star.color));

    // --- ЭКЛИПТИКА (ОКРУЖНОСТЬ ЧЕРЕЗ 3 ТОЧКИ) ---
    function getPointOnSphere(raHours, decDeg) {
      const raRad = (raHours * 15) * (Math.PI / 180);
      const decRad = decDeg * (Math.PI / 180);
      const x = Math.cos(decRad) * Math.sin(raRad);
      const y = Math.sin(decRad);
      const z = Math.cos(decRad) * Math.cos(raRad);
      return new THREE.Vector3(x * sphereRadius, y * sphereRadius, z * sphereRadius);
    }

    const pSummer = getPointOnSphere(6, 23.44);      // Летнее солнцестояние
    const pWinter = getPointOnSphere(18, -23.44);   // Зимнее солнцестояние
    const pZAxis = new THREE.Vector3(0, 0, sphereRadius); // Точка (0,0,R)

    const v1 = new THREE.Vector3().subVectors(pWinter, pSummer);
    const v2 = new THREE.Vector3().subVectors(pZAxis, pSummer);
    const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();

    const u = pSummer.clone().normalize();
    const v = new THREE.Vector3().crossVectors(normal, u).normalize();

    const segments = 128;
    const lineGeo = new THREE.BufferGeometry();
    const positions = new Float32Array((segments + 1) * 3);

    for (let i = 0; i <= segments; i++) {
      const t = (i / segments) * Math.PI * 2;
      const point = new THREE.Vector3()
        .copy(u).multiplyScalar(Math.cos(t))
        .add(new THREE.Vector3().copy(v).multiplyScalar(Math.sin(t)))
        .multiplyScalar(sphereRadius);

      positions[i * 3] = point.x;
      positions[i * 3 + 1] = point.y;
      positions[i * 3 + 2] = point.z;
    }
    lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const lineMat = new THREE.LineBasicMaterial({ color: 0xff8800, linewidth: 2 });
    const eclipticLine = new THREE.Line(lineGeo, lineMat);
    earthGroup.add(eclipticLine);

    // Маркеры на эклиптике
    function createBeacon(pos, color, size) {
      const geo = new THREE.SphereGeometry(size, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color: color, emissive: color, emissiveIntensity: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(pos);
      return mesh;
    }

    earthGroup.add(createBeacon(pSummer, 0x00ff00, 0.0)); // Лето
    earthGroup.add(createBeacon(pWinter, 0xff0000, 0.0)); // Зима
    earthGroup.add(createBeacon(pZAxis, 0xffa500, 0.0));   // Z
    earthGroup.add(createBeacon(pZAxis.clone().negate(), 0xffa500, 0.0)); // Противоположная

    // --- ДВИЖУЩЕЕСЯ СОЛНЦЕ ---
    const sunGeo = new THREE.SphereGeometry(sunRadius, 16, 16);
    const sunMat = new THREE.MeshBasicMaterial({ 
      color: 0xffff00, 
      emissive: 0xffaa00, 
      emissiveIntensity: 0.8 
    });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    earthGroup.add(sun);

    // Предварительно рассчитаем массив точек эклиптики
    const eclipticPoints = [];
    for (let i = 0; i < segments; i++) {
      const t = (i / segments) * Math.PI * 2;
      const point = new THREE.Vector3()
        .copy(u).multiplyScalar(Math.cos(t))
        .add(new THREE.Vector3().copy(v).multiplyScalar(Math.sin(t)))
        .multiplyScalar(sphereRadius);
      
      const raRad = Math.atan2(point.x, point.z);
      let raHours = (raRad * (180 / Math.PI)) / 15;
      if (raHours < 0) raHours += 24;

      eclipticPoints.push({ pos: point, ra: raHours });
    }
    eclipticPoints.sort((a, b) => a.ra - b.ra);

    let currentRA = 6.0;
    const statusEl = document.getElementById('status');

    function moveSunToRA(targetRA) {
      targetRA = ((targetRA % 24) + 24) % 24;

      let bestIdx = 0;
      let minDiff = 100;

      for (let i = 0; i < eclipticPoints.length; i++) {
        const p = eclipticPoints[i];
        let diff = Math.abs(p.ra - targetRA);
        if (diff > 12) diff = 24 - diff;
        
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = i;
        }
      }

      const targetPoint = eclipticPoints[bestIdx];
      sun.position.copy(targetPoint.pos);
      currentRA = targetPoint.ra;
      statusEl.textContent = `Текущее RA: ${currentRA.toFixed(2)} ч`;
    }

    moveSunToRA(currentRA);

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    if (btnLeft && btnRight) {
      btnLeft.addEventListener('click', () => moveSunToRA(currentRA - 1));
      btnRight.addEventListener('click', () => moveSunToRA(currentRA + 1));
    }

    // Камера
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minPolarAngle = 0.1;
    controls.maxPolarAngle = Math.PI - 0.1;
    controls.minDistance = 6;
    controls.maxDistance = 15;

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
